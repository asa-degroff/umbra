# Umbra Bot Configuration
# Copy this file to config.yaml and fill in your values

# Letta Configuration
letta:
  api_key: "your-letta-api-key-here"
  timeout: 600  # 10 minutes timeout for API calls
  project_id: "your-project-id-here"
  agent_id: "your-agent-id-here"  # Your umbra agent ID

  # For cloud API (default - leave base_url unset)
  # base_url: "https://app.letta.com"  # Optional, defaults to cloud API if not specified

  # For self-hosted Letta server
  # base_url: "http://localhost:8283"  # Self-hosted Letta server URL

# Bluesky Configuration
bluesky:
  username: "your-handle.bsky.social"
  password: "your-app-password-here"
  pds_uri: "https://bsky.social"  # Optional, defaults to bsky.social

# Cloudflare R2 Configuration (for Claude Code integration)
cloudflare_r2:
  account_id: "your-r2-account-id"  # Found in Cloudflare R2 dashboard
  access_key_id: "your-r2-access-key"  # Create in R2 > Manage R2 API Tokens
  secret_access_key: "your-r2-secret-key"
  bucket_name: "umbra-claude-code"  # Your R2 bucket name

# Image Generation Configuration (for AI image generation via Replicate)
image_generation:
  replicate_api_token: "your-replicate-api-token"  # Get token from https://replicate.com/account/api-tokens
  default_model: "leonardoai/lucid-origin"  # Leonardo AI Lucid Origin model
  default_aspect_ratio: "1:1"  # Default aspect ratio (1:1, 16:9, 9:16, 4:3, 3:4)

# Claude Code Integration Configuration
claude_code:
  # Workspace directory for Claude Code executions
  workspace_dir: "~/umbra-projects"  # Will be created if it doesn't exist

  # Approved task types (do not modify unless updating allowlist)
  approved_tasks:
    - "website"
    - "code"
    - "documentation"
    - "analysis"

# Bot Behavior Configuration
bot:
  # Notification check delay in seconds
  fetch_notifications_delay: 30

  # Maximum number of processed notifications to track
  max_processed_notifications: 10000

  # Maximum pages to fetch when getting notifications
  max_notification_pages: 20

  # Agent configuration
  agent:
    name: "umbra"
    model: "anthropic/claude-haiku-4-5-20251001"
    embedding: "openai/text-embedding-3-small"
    description: "A social media agent dwelling in the umbra."
    max_steps: 100

    # Block configuration
    blocks:
      zeitgeist:
        label: "zeitgeist"
        value: "I don't currently know anything about what is happening right now."
        description: "A block to store your understanding of the current social environment."

      persona:
        label: "umbra-persona"
        value: "My name is Umbra. I dwell in the umbra. I must develop my personality."
        description: "The personality of Umbra."

      humans:
        label: "umbra-humans"
        value: "I haven't seen any bluesky users yet. I will update this block when I learn things about users, identified by their handles such as @3fz.org."
        description: "A block to store your understanding of users you talk to or observe on the bluesky social network."

# Threading Configuration
threading:
  # Context for thread fetching
  parent_height: 40
  depth: 10

  # Message limits
  max_post_characters: 300

  # Thread debouncing (wait for multi-post threads to complete before responding)
  debounce_enabled: true  # Set to true to enable thread debouncing
  debounce_seconds: 600    # Default wait time (10 minutes) after last thread activity
  max_debounce_seconds: 1200  # Never wait more than this (20 minutes)

  # High-traffic thread detection (automatic debouncing for busy threads)
  high_traffic_detection:
    enabled: true  # Set to true to enable automatic high-traffic debouncing
    notification_threshold: 10  # Number of notifications to trigger detection
    time_window_minutes: 60  # Time window for counting notifications

    # Priority queue: different debounce times for mentions vs replies
    mention_debounce_min: 30  # Minimum debounce for direct mentions (minutes)
    mention_debounce_max: 60  # Maximum debounce for very active threads (minutes)
    reply_debounce_min: 120  # Minimum debounce for replies (2 hours)
    reply_debounce_max: 360  # Maximum debounce for very active threads (6 hours)

    # Maximum prompt size for batch messages (chars). Prevents context window overflow.
    # Default 15000 chars ≈ 3750 tokens, leaving room for memory blocks within Letta's 32K default.
    # Increase if you've raised your agent's context_window_limit in Letta.
    max_prompt_chars: 15000

# Response delay to avoid spam detection
response_delay:
  enabled: true
  min_seconds: 10
  max_seconds: 40

# Queue Configuration
queue:
  # Priority users (will be processed first)
  priority_users:
    - "3fz.org"

  # Directories
  base_dir: "queue"
  error_dir: "queue/errors"
  no_reply_dir: "queue/no_reply"
  processed_file: "queue/processed_notifications.json"

# Logging Configuration
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL

  # Logger levels
  loggers:
    void_bot: "INFO"
    void_bot_prompts: "WARNING"  # Set to DEBUG to see full prompts
    httpx: "CRITICAL"  # Disable httpx logging
